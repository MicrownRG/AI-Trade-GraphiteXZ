version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trading_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB:       trading_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Adminer (optional DB UI) ───────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: trading_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # ── Trading Bot (backtest mode by default) ─────────────────────────────────
  trading_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://trader:trader@postgres:5432/trading_db
      RUN_MODE: backtest
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "main.py", "--mode", "backtest", "--data", "data/XAUUSD_M15.csv"]

volumes:
  pgdata:
